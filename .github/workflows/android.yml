name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run engine and server tests (unit, simulation, leak, offline checks)
        run: ./gradlew :engine:test :server:test --no-daemon --stacktrace

      - name: Build the runnable server jar (for PC testing)
        run: ./gradlew :server:fatJar --no-daemon --stacktrace

      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: server-jar
          path: server/build/libs/server-all.jar
          if-no-files-found: error

      - name: Build debug APK
        # The Android SDK is preinstalled on the GitHub runner (ANDROID_HOME), which makes
        # settings.gradle.kts include the :app module.
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: avalon-offline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Coup browser test (plays full games through the real UI)
        run: |
          npm install -g playwright@1.48.2
          npx --yes playwright@1.48.2 install --with-deps chromium
          NODE_PATH=$(npm root -g) node tools/coup-ui-test.mjs

      - name: Save Coup screenshots to the branch
        if: always() && github.event_name == 'push' && startsWith(github.ref_name, 'claude/')
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/screenshots/coup || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Update Coup screenshots [skip ci]"
          git push || echo "screenshot push skipped (branch moved)"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            engine/build/reports/tests
            server/build/reports/tests
          if-no-files-found: ignore
