name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run engine and server tests (unit, simulation, leak, offline checks)
        run: ./gradlew :engine:test :server:test --no-daemon --stacktrace

      - name: Build debug APK
        # The Android SDK is preinstalled on the GitHub runner (ANDROID_HOME), which makes
        # settings.gradle.kts include the :app module.
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: avalon-offline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            engine/build/reports/tests
            server/build/reports/tests
          if-no-files-found: ignore
